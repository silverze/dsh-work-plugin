name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are not available for this account yet; the Swift
        # helper is compiled by hand in docs/architecture.md instead.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm check:public
      - run: pnpm docs:check
      - name: Compile the screen helper (macOS)
        if: runner.os == 'macOS'
        run: swiftc -O packages/host-work/native/screen-ocr.swift -o /tmp/screen-ocr-smoke

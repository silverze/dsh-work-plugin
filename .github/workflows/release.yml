name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing: GitHub mints an OIDC token and pnpm exchanges it for a
  # credential valid for this one publish. No NPM_TOKEN secret is involved.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:public
      # Each package needs a trusted publisher on npmjs.com (one relationship per
      # package, workflow file release.yml, "npm publish" allowed). Configure them
      # before pushing the first tag; see docs/release.md for the steps. Without
      # them this step fails on purpose: a release run that stays green while
      # publishing nothing hides a broken configuration.
      - name: Publish to npm
        run: node scripts/release-publish.mjs

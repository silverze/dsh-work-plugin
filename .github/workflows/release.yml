name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:public
      # Publishing needs either a granular token with bypass-2FA (NPM_TOKEN)
      # or a trusted publisher configured for each package on npmjs.com.
      # Without one of them the release job stays green and skips this step,
      # so a tag push never leaves a red run behind. The check has to happen in
      # the shell: an unset secret arrives as an empty env value, and a
      # `if: env.NODE_AUTH_TOKEN != ''` guard still evaluates true for it.
      - name: Publish to npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::Publishing skipped: set the NPM_TOKEN secret or configure a trusted publisher for @dsh-work-plugin/* on npmjs.com."
            exit 0
          fi
          node scripts/release-publish.mjs

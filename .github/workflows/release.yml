name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:public
      # Publishing needs either a granular token with bypass-2FA (NPM_TOKEN)
      # or a trusted publisher configured for each package on npmjs.com.
      # Without one of them the release job stays green and skips this step,
      # so a tag push never leaves a red run behind.
      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: pnpm -r publish --access public --no-git-checks --provenance
      - name: Skip notice
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: |
          echo "::notice::Publishing skipped: set the NPM_TOKEN secret or configure a trusted publisher for @dsh-work-plugin/* on npmjs.com."

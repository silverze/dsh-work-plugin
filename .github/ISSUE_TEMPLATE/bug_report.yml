name: Bug report
description: Something broke while using the plugin
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please remove names, chat content, order numbers and tokens from screenshots and logs.
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.2.2-rc.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.2 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable work mode in a session
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error text
    validations:
      required: true
